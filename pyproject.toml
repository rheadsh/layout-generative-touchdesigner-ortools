[project]
name = "layout-generative"
version = "0.1.0"
description = "Solver editorial CP-SAT (OR-Tools) para TouchDesigner"
# Misma versión que el Python embebido de TouchDesigner 2025.x
requires-python = "==3.11.*"
dependencies = [
    "ortools>=9.15",
    # Fijado a la versión que trae TD: TD carga la suya primero y deben coincidir.
    "numpy==2.1.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["previews"]
# Globales que TouchDesigner inyecta en los scripts de TouchDesigner/.
builtins = [
    "op", "parent", "me", "mod", "ui", "project", "debug", "run", "tdu",
    "baseCOMP", "replicatorCOMP", "tableDAT", "textDAT", "executeDAT",
    "parameterexecuteDAT", "datexecuteDAT", "scriptTOP", "nullTOP", "moviefileinTOP",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ARG", "RUF"]
# Textos en español: comillas « » y acentos son intencionales.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Las firmas de los callbacks de TouchDesigner son fijas aunque no usen todos los argumentos.
"TouchDesigner/*.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["editorial_solver", "layout_config", "tests"]

[tool.ruff.format]
quote-style = "preserve"
